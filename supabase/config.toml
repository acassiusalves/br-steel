# Dedicated LOCAL OAuth identity provider. No operational BR Steel data lives here.
# CLI 2.114.0; generate ignored signing keys with scripts/oauth-provider-local.mjs.
project_id = "brsteel-mcp-oauth"

[api]
enabled = true
port = 55321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[api.tls]
enabled = false

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
enabled = false
port = 55329

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = false
port = 55323

[local_smtp]
enabled = false
port = 55324

[storage]
enabled = false

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:9003"
external_url = "http://127.0.0.1:55321/auth/v1"
jwt_issuer = "http://127.0.0.1:55321/auth/v1"
additional_redirect_urls = ["http://localhost:9003/oauth/consent"]
jwt_expiry = 900
signing_keys_path = "./.env.signing-keys.local"
jwt_secret = "env(BRSTEEL_OAUTH_JWT_SECRET)"
publishable_key = "env(BRSTEEL_OAUTH_PUBLISHABLE_KEY)"
secret_key = "env(BRSTEEL_OAUTH_SECRET_KEY)"
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 0
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
otp_expiry = 300

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/private/mcp_access_token_hook"

[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = true

[edge_runtime]
enabled = false

[analytics]
enabled = false
port = 55327
